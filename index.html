<!DOCTYPE html>
<html>
<head>
  <title>Foxie AI</title>
</head>
<body>

  <h1>🦊 Hello! I'm Foxie</h1>
  <p>Your friendly AI assistant.</p>

  <input id="message" type="text" placeholder="Talk to Foxie...">
  <button onclick="talkToFoxie()">Send</button>

  <p id="reply"></p>

  <script>
    async function talkToFoxie() {
      const message = document.getElementById("message").value;
      const reply = document.getElementById("reply");

      if (message.trim() === "") {
        reply.textContent = "🦊 Type something first!";
        return;
      }

      reply.textContent = "🦊 Foxie is thinking...";

      try {
        const response = await fetch(
          "https://foxie-ai-backend.onrender.com/chat",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong");
        }

        reply.textContent = "🦊 " + data.reply;

      } catch (error) {
        reply.textContent =
          "🦊 Sorry, Foxie couldn't connect right now.";
      }
    }
  </script>

</body>
</html>
