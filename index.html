<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FOXIE AI 🦊</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {

      min-height: 100vh;

      background:
        radial-gradient(circle at center, #061006 0%, #010201 55%, #000000 100%);

      color: #39ff14;

      font-family: "Courier New", monospace;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      overflow: hidden;

      position: relative;
    }


    /* =========================
       HACKER GRID
       ========================= */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      background:
        linear-gradient(
          rgba(57,255,20,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(57,255,20,0.035) 1px,
          transparent 1px
        );

      background-size: 35px 35px;

      pointer-events: none;

      z-index: 0;
    }


    /* =========================
       FLOATING PARTICLES
       ========================= */

    .particles {

      position: fixed;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 1;
    }


    .particle {

      position: absolute;

      bottom: -20px;

      width: 3px;

      height: 3px;

      background: #39ff14;

      border-radius: 50%;

      box-shadow:
        0 0 6px #39ff14,
        0 0 12px #39ff14;

      animation: floatUp linear infinite;

      opacity: 0;
    }


    @keyframes floatUp {

      0% {

        transform:
          translateY(0)
          translateX(0);

        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      50% {

        transform:
          translateY(-50vh)
          translateX(20px);

        opacity: 1;
      }

      90% {
        opacity: 0.5;
      }

      100% {

        transform:
          translateY(-110vh)
          translateX(-30px);

        opacity: 0;
      }

    }


    /* =========================
       RANDOM DIGITAL GLITCH
       ========================= */

    .code-rain {

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 2;

      opacity: 0.25;

      color: #39ff14;

      font-size: 12px;

      text-shadow: 0 0 5px #39ff14;
    }


    .code {

      position: absolute;

      animation: codeFloat linear infinite;

    }


    @keyframes codeFloat {

      from {

        transform: translateY(100vh);

        opacity: 0;
      }

      15% {
        opacity: 0.8;
      }

      85% {
        opacity: 0.6;
      }
