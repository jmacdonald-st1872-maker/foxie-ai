```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOXIE AI 🦊</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #000;
  color: #39ff14;
  font-family: "Courier New", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* GREEN PARTICLES */
.particles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.particle {
  position: absolute;
  bottom: -10px;
  width: 3px;
  height: 3px;
  background: #39ff14;
  border-radius: 50%;
  box-shadow: 0 0 8px #39ff14;
  animation: floatUp 8s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(0);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

/* FOXIE WINDOW */
.container {
  width: 90%;
  max-width: 850px;
  height: 90vh;
  max-height: 700px;

  border: 1px solid #39ff14;
  background: rgba(0, 10, 3, 0.96);

  box-shadow:
    0 0 20px rgba(57,255,20,0.3),
    0 0 60px rgba(57,255,20,0.1);

  padding: 25px;

  display: flex;
  flex-direction: column;

  position: relative;
  z-index: 5;
}

/* TITLE */
.glitch {
  text-align: center;
  margin: 0;
  font-size: 42px;

  text-shadow:
    2px 0 #00ff88,
    -2px 0 #00aa00,
    0 0 15px #39ff14;

  animation: glitch 1.5s infinite;
}

@keyframes glitch {
  0%, 90%, 100% {
    transform: translate(0);
  }

  92% {
    transform: translate(-4px, 2px);
  }

  94% {
    transform: translate(4px, -2px);
  }
}

.subtitle {
  text-align: center;
  margin: 5px 0 15px;
}

/* STATUS */
.status {
  font-size: 13px;
  margin-bottom: 10px;
}

/* CHAT */
.chat {
  flex: 1;
  min-height: 0;

  overflow-y: auto;

  border: 1px solid #174d17;
  background: #000300;

  padding: 15px;
  margin-bottom: 15px;
}

.message {
  margin: 12px 0;
  line-height: 1.5;
}

.user {
  color: white;
}

.foxie {
  color: #39ff14;
  text-shadow: 0 0 6px #39ff14;
}

/* INPUT */
.input-area {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;

  background: #000;
  border: 1px solid #39ff14;

  color: white;

  padding: 14px;

  font-family: "Courier New", monospace;
  font-size: 16px;

  outline: none;
}

input::placeholder {
  color: #397a39;
}

input:focus {
  box-shadow: 0 0 10px rgba(57,255,20,0.4);
}

button {
  background: #39ff14;
  color: #000;

  border: none;

  padding: 14px 22px;

  font-family: "Courier New", monospace;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  box-shadow:
    0 0 10px #39ff14,
    0 0 25px #39ff14;
}

.footer {
  text-align: center;
  font-size: 10px;
  opacity: 0.5;
  margin-top: 10px;
}

/* MOBILE */
@media (max-width: 600px) {
  .container {
    width: 95%;
    height: 95vh;
    padding: 15px;
  }

  .glitch {
    font-size: 30px;
  }

  .input-area {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="particles">
  <div class="particle" style="left:5%; animation-delay:0s;"></div>
  <div class="particle" style="left:15%; animation-delay:2s;"></div>
  <div class="particle" style="left:25%; animation-delay:4s;"></div>
  <div class="particle" style="left:35%; animation-delay:1s;"></div>
  <div class="particle" style="left:45%; animation-delay:3s;"></div>
  <div class="particle" style="left:55%; animation-delay:5s;"></div>
  <div class="particle" style="left:65%; animation-delay:2s;"></div>
  <div class="particle" style="left:75%; animation-delay:4s;"></div>
  <div class="particle" style="left:85%; animation-delay:1s;"></div>
  <div class="particle" style="left:95%; animation-delay:3s;"></div>
</div>

<div class="container">

  <h1 class="glitch">🦊 FOXIE AI</h1>

  <div class="subtitle">
    // your friendly AI assistant //
  </div>

  <div class="status">
    ● SYSTEM ONLINE
  </div>

  <div class="chat" id="chat">

    <div class="message foxie">
      🦊 Hey there! I'm Foxie. How can I help you today?
    </div>

  </div>

  <div class="input-area">

    <input
      id="message"
      type="text"
      placeholder="Talk to Foxie..."
      autocomplete="off"
      onkeydown="if(event.key === 'Enter') talkToFoxie()"
    >

    <button onclick="talkToFoxie()">
      SEND
    </button>

  </div>

  <div class="footer">
    FOXIE AI // CONNECTION ESTABLISHED
  </div>

</div>

<script>
async function talkToFoxie() {

  const input = document.getElementById("message");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if (message === "") {
    return;
  }

  chat.innerHTML += `
    <div class="message user">
      &gt; YOU: ${message}
    </div>
  `;

  input.value = "";

  chat.innerHTML += `
    <div class="message foxie" id="thinking">
      🦊 Foxie is thinking...
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch(
      "https://foxie-ai-backend.onrender.com/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      }
    );

    const data = await response.json();

    const thinking = document.getElementById("thinking");

    if (thinking) {
      thinking.remove();
    }

    if (data.reply) {

      chat.innerHTML += `
        <div class="message foxie">
          🦊 FOXIE: ${data.reply}
        </div>
      `;

    } else {

      chat.innerHTML += `
        <div class="message foxie">
          🦊 Something went wrong.
        </div>
      `;

    }

  } catch (error) {

    const thinking = document.getElementById("thinking");

    if (thinking) {
      thinking.remove();
    }

    chat.innerHTML += `
      <div class="message foxie">
        🦊 ERROR: Foxie couldn't connect.
      </div>
    `;
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
```
