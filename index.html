<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOXIE AI 🦊</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #000;
  color: #39ff14;
  font-family: "Courier New", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* BACKGROUND */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(57,255,20,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(57,255,20,0.025) 1px, transparent 1px);
  background-size: 35px 35px;
  pointer-events: none;
}

/* GREEN PARTICLES */
.particles {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.particle {
  position: absolute;
  bottom: -10px;
  width: 3px;
  height: 3px;
  background: #39ff14;
  border-radius: 50%;
  box-shadow: 0 0 8px #39ff14;
  animation: floatUp 8s linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(0);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

/* CREATOR CREDIT */
.creator {
  position: fixed;
  top: 12px;
  right: 16px;
  color: #39ff14;
  font-size: 11px;
  opacity: 0.65;
  z-index: 20;
  text-shadow: 0 0 7px #39ff14;
}

/* FOXIE WINDOW */
.container {
  width: 90%;
  max-width: 850px;
  height: 90vh;
  max-height: 700px;

  border: 1px solid #39ff14;
  background: rgba(0, 8, 2, 0.96);

  box-shadow:
    0 0 20px rgba(57,255,20,0.25),
    0 0 70px rgba(57,255,20,0.08);

  padding: 25px;

  display: flex;
  flex-direction: column;

  position: relative;
  z-index: 5;
}

/* TITLE */
.glitch {
  text-align: center;
  margin: 0;
  font-size: 42px;
  letter-spacing: 3px;

  text-shadow:
    2px 0 #00ff88,
    -2px 0 #00aa00,
    0 0 15px #39ff14;

  animation: glitch 1.8s infinite;
}

@keyframes glitch {
  0%, 90%, 100% {
    transform: translate(0);
  }

  92% {
    transform: translate(-3px, 2px);
  }

  94% {
    transform: translate(3px, -2px);
  }
}

.subtitle {
  text-align: center;
  margin: 5px 0 15px;
  opacity: 0.7;
}

/* STATUS */
.status {
  font-size: 12px;
  margin-bottom: 10px;
  opacity: 0.8;
}

/* CHAT */
.chat {
  flex: 1;
  min-height: 0;

  overflow-y: auto;

  border: 1px solid #174d17;
  background: #000300;

  padding: 15px;
  margin-bottom: 15px;
}

.message {
  margin: 12px 0;
  line-height: 1.5;
  word-wrap: break-word;
}

.user {
  color: white;
}

.foxie {
  color: #39ff14;
  text-shadow: 0 0 6px #39ff14;
}

/* INPUT */
.input-area {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;

  background: #000;
  border: 1px solid #39ff14;

  color: white;

  padding: 14px;

  font-family: "Courier New", monospace;
  font-size: 16px;

  outline: none;
}

input::placeholder {
  color: #397a39;
}

input:focus {
  box-shadow: 0 0 12px rgba(57,255,20,0.35);
}

button {
  background: #39ff14;
  color: #000;

  border: none;

  padding: 14px 22px;

  font-family: "Courier New", monospace;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  box-shadow:
    0 0 10px #39ff14,
    0 0 25px #39ff14;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* FOOTER */
.footer {
  text-align: center;
  font-size: 10px;
  opacity: 0.45;
  margin-top: 10px;
}

/* CREATOR MODE */
.creator-panel {
  display: none;

  position: fixed;
  inset: 0;

  background: rgba(0, 0, 0, 0.96);

  z-index: 100;

  justify-content: center;
  align-items: center;
}

.creator-box {
  width: 90%;
  max-width: 600px;

  border: 1px solid #39ff14;

  padding: 40px;

  background: #000800;

  box-shadow:
    0 0 25px rgba(57,255,20,0.4),
    0 0 80px rgba(57,255,20,0.15);

  text-align: center;
}

.creator-box h2 {
  font-size: 28px;
  margin-top: 0;

  text-shadow:
    0 0 10px #39ff14;
}

.creator-message {
  font-size: 18px;
  margin: 25px 0;

  color: white;
}

.creator-label {
  font-size: 11px;
  opacity: 0.6;
  margin-bottom: 25px;
}

.close-creator {
  background: transparent;
  color: #39ff14;

  border: 1px solid #39ff14;

  padding: 10px 20px;

  cursor: pointer;

  font-family: "Courier New", monospace;
}

.close-creator:hover {
  background: #39ff14;
  color: #000;
}

/* MOBILE */
@media (max-width: 600px) {

  .container {
    width: 95%;
    height: 95vh;
    padding: 15px;
  }

  .glitch {
    font-size: 30px;
  }

  .creator {
    font-size: 9px;
    right: 8px;
  }

  .input-area {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .creator-box {
    padding: 25px;
  }
}
</style>
</head>

<body>

<!-- PARTICLES -->
<div class="particles">

  <div class="particle" style="left:5%; animation-delay:0s;"></div>
  <div class="particle" style="left:15%; animation-delay:2s;"></div>
  <div class="particle" style="left:25%; animation-delay:4s;"></div>
  <div class="particle" style="left:35%; animation-delay:1s;"></div>
  <div class="particle" style="left:45%; animation-delay:3s;"></div>
  <div class="particle" style="left:55%; animation-delay:5s;"></div>
  <div class="particle" style="left:65%; animation-delay:2s;"></div>
  <div class="particle" style="left:75%; animation-delay:4s;"></div>
  <div class="particle" style="left:85%; animation-delay:1s;"></div>
  <div class="particle" style="left:95%; animation-delay:3s;"></div>

</div>

<!-- CREATOR CREDIT -->
<div class="creator">
  Jayden Wayne MacDonald created this
</div>

<!-- MAIN FOXIE -->
<div class="container">

  <h1 class="glitch">
    🦊 FOXIE AI
  </h1>

  <div class="subtitle">
    // your friendly AI assistant //
  </div>

  <div class="status">
    ● SYSTEM ONLINE
  </div>

  <div class="chat" id="chat">

    <div class="message foxie">
      🦊 Hey there! I'm Foxie. How can I help you today?
    </div>

  </div>

  <div class="input-area">

    <input
      id="message"
      type="text"
      placeholder="Talk to Foxie..."
      autocomplete="off"
    >

    <button id="sendButton">
      SEND
    </button>

  </div>

  <div class="footer">
    FOXIE AI // CONNECTION ESTABLISHED
  </div>

</div>

<!-- SECRET CREATOR PANEL -->
<div class="creator-panel" id="creatorPanel">

  <div class="creator-box">

    <h2>🦊 CREATOR MODE</h2>

    <div class="creator-label">
      ACCESS GRANTED // CREATOR
    </div>

    <div class="creator-message">
      Hello Creator. How are you? 👋
    </div>

    <button class="close-creator" id="closeCreator">
      CLOSE
    </button>

  </div>

</div>

<script>

const input = document.getElementById("message");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("sendButton");

const creatorPanel = document.getElementById("creatorPanel");
const closeCreator = document.getElementById("closeCreator");


/* SECRET CREATOR CODE */
const creatorCode = "jayden2010!";


/* ADD MESSAGE SAFELY */
function addMessage(text, className) {

  const messageDiv = document.createElement("div");

  messageDiv.className = "message " + className;

  messageDiv.textContent = text;

  chat.appendChild(messageDiv);

  chat.scrollTop = chat.scrollHeight;

  return messageDiv;
}


/* TALK TO FOXIE */
async function talkToFoxie() {

  const message = input.value.trim();

  if (message === "") {
    return;
  }

  /* SECRET CREATOR ACCESS */
  if (message.toLowerCase() === creatorCode) {

    input.value = "";

    creatorPanel.style.display = "flex";

    return;
  }

  /* SHOW USER MESSAGE */
  addMessage("> YOU: " + message, "user");

  input.value = "";

  sendButton.disabled = true;

  const thinking = addMessage(
    "🦊 Foxie is thinking...",
    "foxie"
  );

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch(
      "https://foxie-ai-backend.onrender.com/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      }
    );

    const data = await response.json();

    thinking.remove();

    if (data.reply) {

      addMessage(
        "🦊 FOXIE: " + data.reply,
        "foxie"
      );

    } else {

      addMessage(
        "🦊 Something went wrong.",
        "foxie"
      );

    }

  } catch (error) {

    thinking.remove();

    addMessage(
      "🦊 ERROR: Foxie couldn't connect.",
      "foxie"
    );

  }

  sendButton.disabled = false;

  input.focus();

  chat.scrollTop = chat.scrollHeight;
}


/* SEND BUTTON */
sendButton.addEventListener(
  "click",
  talkToFoxie
);


/* ENTER KEY */
input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      talkToFoxie();
    }

  }
);


/* CLOSE CREATOR MODE */
closeCreator.addEventListener(
  "click",
  function() {

    creatorPanel.style.display = "none";

    input.focus();

  }
);

</script>

</body>
</html>
